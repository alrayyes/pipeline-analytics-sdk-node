version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A bumped dependency ships in the published package, so it earns a
    # `fix:` release the same as any other bug fix (rules/releases.md's
    # "Dependency bots" section) -- github-actions below stays `ci:`
    # since it only changes the pipeline, never the artifact.
    commit-message:
      prefix: fix
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
      github-actions-major:
        update-types: [major]
