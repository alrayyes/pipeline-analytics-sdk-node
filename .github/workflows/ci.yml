name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage/lcov.info
            junit.xml
          retention-days: 1

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/openapi:/spec:ro" \
            stoplight/prism:5 mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image -- see hush-hush-go's
          # CLAUDE.md for the reproduction.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: bun run test:contract
        env:
          PIPELINE_ANALYTICS_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  # Separate from `test` (and deliberately not in branch protection's
  # required checks) so a Codecov outage or a bad CODECOV_TOKEN can't block
  # every future merge, release-please's own PR included.
  # `fail_ci_if_error: true` still surfaces a real upload problem loudly;
  # it just doesn't gate anything.
  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
      # Dependabot PRs can't read Actions secrets, so the upload fails with
      # "Token required because branch is protected". Skip it there.
      - name: Upload coverage to Codecov
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: biome
        run: bun x @biomejs/biome check .
      - name: sort-package-json --check
        run: bun x sort-package-json --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

  generated-code-is-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Regenerating from the pinned spec reproduces the committed types
        run: |
          ./hack/fetch-spec.sh
          bun run generate
          git diff --exit-code openapi/openapi.yaml src/generated/schema.ts

  # Works out whether a pull request touches the dependency manifests. A skipped job reports
  # success, so `audit` can stay a required check; a `paths:` filter on the workflow would
  # leave it pending forever. A push to main always runs it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.groups.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT}" != pull_request ] ||
            git diff --name-only "${BASE}...HEAD" | grep -Eq '^(package\.json|bun\.lock|\.github/workflows/ci\.yml)$'; then
            echo deps=true >> "$GITHUB_OUTPUT"
          else
            echo deps=false >> "$GITHUB_OUTPUT"
          fi

  # Fails only on advisories this change adds over its base (rules/dependencies.md, #112).
  # What's already on main is the scan's to track, in advisory-scan.yml.
  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: gate
          command: bun audit

  # Coverage says a line ran, not that a test would catch a change to it --
  # mutation testing is the same missing-test-case gap, caught by a tool
  # instead of a reviewer's eye (testing.md). thresholds.break: 100 in
  # stryker.config.mjs means any surviving mutant fails this job.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # Stryker itself runs on Node -- only the test children it spawns run
      # on Bun (javascript.md: "install a real node in that job" rather
      # than leaning on Bun's Node-compat shim for a tool that shells out).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:mutation

  # Semgrep's cross-file taint tracking catches an injection path a
  # linter's pattern rules can't see; Biome stays for style/correctness
  # linting (rules/javascript.md's "Security" section names this split
  # over eslint-plugin-security). No SEMGREP_APP_TOKEN: `p/ci` is a free
  # Semgrep Registry ruleset, no paid tier or login needed.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.177.0
      - run: semgrep ci --config p/ci --config p/typescript
