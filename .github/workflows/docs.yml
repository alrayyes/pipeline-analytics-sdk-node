# Publishes the generated API reference plus the test and coverage reports
# (reports/) -- not a correctness check, so it's its own workflow rather than
# a job in ci.yml, and a red run here never blocks a merge the way ci.yml's
# jobs do. A repo has one Pages deployment, so both ship from this workflow. The
# tests run first: a red run stops before anything is deployed.
name: docs

# No path filter on main: a deploy replaces the whole site, so a docs-only
# push that skipped the report steps would delete the reports. Pull requests
# build everything but upload and deploy nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: test
        run: bun run test:ci
      - run: bun run docs
      # TypeDoc has no option to copy an arbitrary file to the output root
      # (only `media`, into <out>/media/, and customCss/customJs, into
      # <out>/assets/) -- so llms.txt is copied in here rather than picked
      # up by the typedoc build itself.
      - run: cp llms.txt docs-site/llms.txt
      # After `bun run docs`, whose cleanOutputDir would wipe reports/.
      - name: Build test and coverage reports
        run: bun hack/reports.ts docs-site/reports
      - if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      # The deploy succeeds even when the URL serves nothing, so fetch the
      # real file. The retries cover the CDN catching up.
      - name: Prove the live coverage.xml
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
