# gitleaks scans the whole history rather than the unpushed range: it takes
# well under a second at this size, and CI does the same (rules/secrets.md).
pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
    biome:
      glob: "*.{js,ts,json}"
      run: bun x @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    sort-package-json:
      glob: "package.json"
      run: bun x sort-package-json {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bun x commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --redact --no-banner
    biome-check:
      run: bun x @biomejs/biome check .
    sort-package-json-check:
      run: bun x sort-package-json --check
    typecheck:
      run: bun run typecheck
    test:
      run: bun test --coverage
